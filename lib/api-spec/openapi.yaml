openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /books:
    get:
      operationId: listBooks
      summary: Bilingual curated catalogue
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
  /orders:
    post:
      operationId: createOrder
      summary: Submit a demo order without charging
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Demo confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderConfirmation" }
  /exchange-rates:
    get:
      operationId: getExchangeRates
      summary: Get cached exchange rates based on KWD
      responses:
        "200":
          description: Current estimated rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeRates" }
        "503":
          description: Rates unavailable
  /countries:
    get:
      operationId: listCountries
      summary: Get translated countries and calling codes
      responses:
        "200":
          description: Countries and fallback status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountriesResponse" }
  /visitor-location:
    get:
      operationId: suggestVisitorCountry
      summary: Suggest a visitor country from IP without storing it
      responses:
        "200":
          description: Detected country code, when available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorLocation" }
  /quotes:
    post:
      operationId: createQuote
      summary: Record an institutional quotation request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /openai/assistant:
    post:
      operationId: askAssistant
      summary: Catalogue and shipping assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantInput" }
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAnswer" }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      summary: Save a newsletter subscription without sending email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterInput" }
      responses:
        "201":
          description: Subscription saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    LocalizedText:
      type: object
      required: [ar, en]
      properties:
        ar: { type: string }
        en: { type: string }
    Book:
      type: object
      required: [id, title, author, publisher, category, subcategory, level, pages, volumes, volumeLabel, metadataProvisional, isDemo, binding, description, price, weightKg, color, featured]
      properties:
        id: { type: integer }
        title: { $ref: "#/components/schemas/LocalizedText" }
        author: { $ref: "#/components/schemas/LocalizedText" }
        publisher: { $ref: "#/components/schemas/LocalizedText" }
        category: { type: string }
        subcategory: { type: string }
        volumes: { type: integer }
        volumeLabel: { $ref: "#/components/schemas/LocalizedText" }
        metadataProvisional: { type: boolean }
        isDemo: { type: boolean }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        pages: { type: integer }
        binding: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        price: { type: number }
        weightKg: { type: number, minimum: 0.01, maximum: 100 }
        color: { type: string }
        featured: { type: boolean }
    OrderItem:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: integer }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    OrderInput:
      type: object
      additionalProperties: false
      required: [name, email, phone, country, city, address, paymentMethod, items]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 7, maxLength: 25 }
        country: { type: string, pattern: "^[A-Z]{2}(-[A-Z]{2})?$" }
        city: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, minLength: 5, maxLength: 500 }
        paymentMethod: { type: string, enum: [knet, card, myfatoorah, stripe] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderConfirmation:
      type: object
      required: [orderNumber, subtotal, shipping, total, demo, shippingEstimate]
      properties:
        orderNumber: { type: string }
        subtotal: { type: number }
        shipping: { type: number }
        total: { type: number }
        demo: { type: boolean }
        shippingEstimate: { $ref: "#/components/schemas/ShippingEstimate" }
    ShippingEstimate:
      type: object
      required: [amountKwd, zone, minDays, maxDays, weightKg]
      properties:
        amountKwd: { type: number }
        zone: { type: string }
        minDays: { type: integer }
        maxDays: { type: integer }
        weightKg: { type: number }
    ExchangeRates:
      type: object
      required: [base, rates, updatedAt]
      properties:
        base: { type: string, enum: [KWD] }
        rates: { type: object, additionalProperties: { type: number, minimum: 0 } }
        updatedAt: { type: string }
    Country:
      type: object
      required: [code, name, callingCode, currency, shippingZone]
      properties:
        code: { type: string }
        name: { $ref: "#/components/schemas/LocalizedText" }
        callingCode: { type: string }
        currency: { type: string }
        shippingZone: { type: string }
    CountriesResponse:
      type: object
      required: [countries, fallback]
      properties:
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        fallback: { type: boolean }
    VisitorLocation:
      type: object
      required: [countryCode]
      properties:
        countryCode: { type: ["string", "null"] }
    QuoteInput:
      type: object
      required: [entityType, name, country, contactMethod, contact, cooperation, message]
      properties:
        entityType: { type: string, enum: [bookshop, publisher, education, charity, research, distributor] }
        name: { type: string, minLength: 2, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 100 }
        contactMethod: { type: string, enum: [email, whatsapp, phone] }
        contact: { type: string, minLength: 5, maxLength: 200 }
        cooperation: { type: string, minLength: 2, maxLength: 200 }
        message: { type: string, minLength: 5, maxLength: 3000 }
    NewsletterInput:
      type: object
      required: [email, language]
      properties:
        email: { type: string, format: email, maxLength: 200 }
        language: { type: string, enum: [ar, en] }
    Receipt:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    AssistantMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 2000 }
    AssistantInput:
      type: object
      required: [language, messages]
      properties:
        language: { type: string, enum: [ar, en] }
        messages:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/AssistantMessage" }
    AssistantAnswer:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

